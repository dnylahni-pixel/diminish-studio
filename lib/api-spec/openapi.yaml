openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: DiminishStudio API - Music learning and chord analysis platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: songs
    description: Song management
  - name: chords
    description: Chord library
  - name: users
    description: User profiles
  - name: library
    description: User song library
  - name: learning
    description: Learning sessions
  - name: processing
    description: Song processing jobs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /songs:
    get:
      operationId: listSongs
      tags: [songs]
      summary: List all songs in the library
      parameters:
        - name: genre
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"

  /songs/{id}:
    get:
      operationId: getSong
      tags: [songs]
      summary: Get a single song with full chord and lyric data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Song details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongDetail"
        "404":
          description: Not found

  /songs/featured:
    get:
      operationId: getFeaturedSongs
      tags: [songs]
      summary: Get featured/trending songs for the landing page
      responses:
        "200":
          description: Featured songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"

  /songs/process:
    post:
      operationId: processSong
      tags: [processing]
      summary: Submit a song URL or upload for processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessSongInput"
      responses:
        "202":
          description: Processing job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJob"

  /songs/process/{jobId}:
    get:
      operationId: getProcessingJob
      tags: [processing]
      summary: Get status of a processing job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJob"

  /chords:
    get:
      operationId: listChords
      tags: [chords]
      summary: Get chord library with diagrams
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
            enum: [guitar, piano, bass, ukulele]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
      responses:
        "200":
          description: Chord library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chord"

  /chords/{name}:
    get:
      operationId: getChord
      tags: [chords]
      summary: Get chord details and finger positions
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chord details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chord"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/register:
    post:
      operationId: registerUser
      tags: [users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /library:
    get:
      operationId: getUserLibrary
      tags: [library]
      summary: Get user's saved song library
      responses:
        "200":
          description: User library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryEntry"
    post:
      operationId: addToLibrary
      tags: [library]
      summary: Add a song to user's library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "201":
          description: Added to library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"

  /library/{songId}:
    delete:
      operationId: removeFromLibrary
      tags: [library]
      summary: Remove a song from library
      parameters:
        - name: songId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /learning/sessions:
    get:
      operationId: getLearningSessions
      tags: [learning]
      summary: Get user's learning sessions
      responses:
        "200":
          description: Learning sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningSession"
    post:
      operationId: createLearningSession
      tags: [learning]
      summary: Start a new learning session for a chord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"

  /learning/sessions/{id}/attempt:
    post:
      operationId: submitChordAttempt
      tags: [learning]
      summary: Submit a chord attempt result (from mic detection)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChordAttemptInput"
      responses:
        "200":
          description: Attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChordAttempt"

  /learning/mastered-chords:
    get:
      operationId: getMasteredChords
      tags: [learning]
      summary: Get list of chords user has mastered
      responses:
        "200":
          description: Mastered chords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasteredChord"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Song:
      type: object
      required: [id, title, artist, genre, duration, coverUrl, bpm, key, difficulty]
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string
        genre:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        coverUrl:
          type: ["string", "null"]
        bpm:
          type: integer
        key:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        playCount:
          type: integer

    SongDetail:
      type: object
      required: [id, title, artist, genre, duration, coverUrl, bpm, key, difficulty, lyrics, chordTimeline, tracks]
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string
        genre:
          type: string
        duration:
          type: integer
        coverUrl:
          type: ["string", "null"]
        bpm:
          type: integer
        key:
          type: string
        difficulty:
          type: string
        lyrics:
          type: array
          items:
            $ref: "#/components/schemas/LyricLine"
        chordTimeline:
          type: array
          items:
            $ref: "#/components/schemas/ChordMeasure"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/AudioTrack"

    LyricLine:
      type: object
      required: [time, text, chords]
      properties:
        time:
          type: number
          description: Time in seconds
        text:
          type: string
        chords:
          type: array
          items:
            type: string

    ChordMeasure:
      type: object
      required: [measure, beat, chord, time]
      properties:
        measure:
          type: integer
        beat:
          type: integer
        chord:
          type: string
        time:
          type: number

    AudioTrack:
      type: object
      required: [id, instrument, label, volume, muted]
      properties:
        id:
          type: integer
        instrument:
          type: string
          enum: [guitar, piano, bass, drums, vocal, synth]
        label:
          type: string
        volume:
          type: number
          description: 0-100
        muted:
          type: boolean

    ProcessSongInput:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: URL or "upload"
        title:
          type: ["string", "null"]
        artist:
          type: ["string", "null"]

    ProcessingJob:
      type: object
      required: [jobId, status, progress, createdAt]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, analyzing, extracting_chords, syncing_lyrics, finalizing, done, error]
        progress:
          type: integer
          description: 0-100
        songId:
          type: ["integer", "null"]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string

    Chord:
      type: object
      required: [id, name, instrument, difficulty, fingers, strings]
      properties:
        id:
          type: integer
        name:
          type: string
        instrument:
          type: string
        difficulty:
          type: string
        fingers:
          type: array
          items:
            type: integer
        strings:
          type: array
          items:
            type: integer
        description:
          type: ["string", "null"]
        audioUrl:
          type: ["string", "null"]

    User:
      type: object
      required: [id, username, email, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        preferredInstrument:
          type: ["string", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        bio:
          type: string
        preferredInstrument:
          type: string

    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LibraryEntry:
      type: object
      required: [id, songId, addedAt, song]
      properties:
        id:
          type: integer
        songId:
          type: integer
        addedAt:
          type: string
        song:
          $ref: "#/components/schemas/Song"

    LibraryInput:
      type: object
      required: [songId]
      properties:
        songId:
          type: integer

    LearningSession:
      type: object
      required: [id, chordName, instrument, startedAt, attemptsCount, successCount]
      properties:
        id:
          type: integer
        chordName:
          type: string
        instrument:
          type: string
        startedAt:
          type: string
        attemptsCount:
          type: integer
        successCount:
          type: integer
        mastered:
          type: boolean

    LearningSessionInput:
      type: object
      required: [chordName, instrument]
      properties:
        chordName:
          type: string
        instrument:
          type: string

    ChordAttemptInput:
      type: object
      required: [success, confidenceScore]
      properties:
        success:
          type: boolean
        confidenceScore:
          type: number
          description: 0-1

    ChordAttempt:
      type: object
      required: [id, sessionId, success, confidenceScore, attemptedAt]
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        success:
          type: boolean
        confidenceScore:
          type: number
        attemptedAt:
          type: string

    MasteredChord:
      type: object
      required: [chordName, instrument, masteredAt, totalAttempts, successRate]
      properties:
        chordName:
          type: string
        instrument:
          type: string
        masteredAt:
          type: string
        totalAttempts:
          type: integer
        successRate:
          type: number
