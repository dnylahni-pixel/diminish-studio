openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: DiminishStudio API - Music learning and chord analysis platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: songs
    description: Song management
  - name: chords
    description: Chord library
  - name: users
    description: User profiles
  - name: library
    description: User song library
  - name: learning
    description: Learning sessions
  - name: uploads
    description: Direct upload lifecycle
  - name: analysis
    description: Song analysis operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Check runtime dependencies
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /songs:
    get:
      operationId: listSongs
      tags: [songs]
      summary: List all songs in the library
      parameters:
        - name: genre
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"

  /songs/{id}:
    get:
      operationId: getSong
      tags: [songs]
      summary: Get public song metadata or an owned private upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Song details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /songs/featured:
    get:
      operationId: getFeaturedSongs
      tags: [songs]
      summary: Get featured/trending songs for the landing page
      responses:
        "200":
          description: Featured songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"

  /songs/{id}/analyze:
    post:
      operationId: analyzeSong
      tags: [analysis]
      summary: Analyze an owned uploaded song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /song-details/{id}:
    get:
      operationId: getSongDetails
      tags: [songs]
      summary: Get Player aggregate with timelines and signed track URLs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player song details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /chords:
    get:
      operationId: listChords
      tags: [chords]
      summary: Get chord library with diagrams
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
            enum: [guitar, piano, bass, ukulele]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
      responses:
        "200":
          description: Chord library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chord"

  /chords/{name}:
    get:
      operationId: getChord
      tags: [chords]
      summary: Get chord details and finger positions
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chord details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chord"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /library/quota:
    get:
      operationId: getStorageQuota
      tags: [library]
      summary: Get user's storage quota and usage
      responses:
        "200":
          description: Storage quota info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageQuota"

  /library:
    get:
      operationId: getUserLibrary
      tags: [library]
      summary: Get user's owned uploaded songs
      responses:
        "200":
          description: User library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibrarySong"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /library/{songId}:
    delete:
      operationId: deleteLibrarySong
      tags: [library]
      summary: Permanently delete an owned song and storage objects
      parameters:
        - name: songId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSongResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /uploads/presign:
    post:
      operationId: presignUpload
      tags: [uploads]
      summary: Create a quarantine upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignUploadInput"
      responses:
        "200":
          description: Presigned upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /uploads/confirm:
    post:
      operationId: confirmUpload
      tags: [uploads]
      summary: Verify and finalize a quarantine upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmUploadInput"
      responses:
        "200":
          description: Upload finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /uploads/{uploadToken}/{ext}:
    delete:
      operationId: cancelUpload
      tags: [uploads]
      summary: Cancel an owned quarantine upload
      parameters:
        - name: uploadToken
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ext
          in: path
          required: true
          schema:
            type: string
            enum: [mp3, wav, flac, m4a, ogg]
      responses:
        "200":
          description: Upload cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /learning/sessions:
    get:
      operationId: getLearningSessions
      tags: [learning]
      summary: Get user's learning sessions
      responses:
        "200":
          description: Learning sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningSession"
    post:
      operationId: createLearningSession
      tags: [learning]
      summary: Start a new learning session for a chord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"

  /learning/sessions/{id}/attempt:
    post:
      operationId: submitChordAttempt
      tags: [learning]
      summary: Submit a chord attempt result (from mic detection)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChordAttemptInput"
      responses:
        "200":
          description: Attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChordAttempt"

  /learning/mastered-chords:
    get:
      operationId: getMasteredChords
      tags: [learning]
      summary: Get list of chords user has mastered
      responses:
        "200":
          description: Mastered chords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasteredChord"

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Gone:
      description: Resource expired or no longer exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: File or quota limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadGateway:
      description: Provider request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    GatewayTimeout:
      description: Provider request timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        details: {}

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ReadinessStatus:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, error]
        dependencies:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, error]

    Song:
      type: object
      required: [id, title, artist, artistId, difficulty, duration, bpm, key, mode, timeSignature, coverUrl, playCount, featured, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: ["string", "null"]
        artistId:
          type: ["integer", "null"]
        duration:
          type: ["number", "null"]
          description: Duration in seconds
        coverUrl:
          type: ["string", "null"]
        bpm:
          type: ["number", "null"]
        key:
          type: ["string", "null"]
        musicalKey:
          type: ["string", "null"]
        mode:
          type: ["string", "null"]
        timeSignature:
          type: ["string", "null"]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        playCount:
          type: integer
        featured:
          type: boolean
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SongDetail:
      type: object
      required: [id, title, artist, artistId, coverUrl, difficulty, duration, bpm, key, mode, timeSignature, version, analysisStatus, generatedAt, beatGrid, chordTimeline, lyrics, sections, tempoTimeline, keyTimeline, tracks, masterTrackUrl, playCount, featured, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string
        artistId:
          type: ["integer", "null"]
        duration:
          type: number
        coverUrl:
          type: ["string", "null"]
        bpm:
          type: number
        key:
          type: string
        mode:
          type: ["string", "null"]
        difficulty:
          type: string
        timeSignature:
          $ref: "#/components/schemas/TimeSignature"
        version:
          type: ["string", "null"]
        analysisStatus:
          type: string
        generatedAt:
          type: ["string", "null"]
          format: date-time
        beatGrid:
          type: array
          items:
            $ref: "#/components/schemas/BeatPoint"
        lyrics:
          type: array
          items:
            $ref: "#/components/schemas/LyricLine"
        chordTimeline:
          type: array
          items:
            $ref: "#/components/schemas/ChordMeasure"
        sections:
          type: array
          items:
            type: object
            additionalProperties: true
        tempoTimeline:
          type: array
          items:
            type: object
            additionalProperties: true
        keyTimeline:
          type: array
          items:
            type: object
            additionalProperties: true
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/AudioTrack"
        masterTrackUrl:
          type: ["string", "null"]
        playCount:
          type: integer
        featured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimeSignature:
      type: object
      required: [numerator, denominator]
      properties:
        numerator:
          type: integer
        denominator:
          type: integer

    BeatPoint:
      type: object
      required: [time, beat, measure, isDownbeat]
      properties:
        time:
          type: number
        beat:
          type: integer
        measure:
          type: integer
        isDownbeat:
          type: boolean

    LyricLine:
      type: object
      required: [time, text, chords]
      properties:
        time:
          type: number
        text:
          type: string
        chords:
          type: array
          items:
            type: string

    ChordMeasure:
      type: object
      required: [measure, beat, chord, time]
      properties:
        measure:
          type: integer
        beat:
          type: integer
        chord:
          type: string
        time:
          type: number

    AudioTrack:
      type: object
      required: [id, instrument, label, volume, muted, soloable, pan, streamUrl, offset, normalizationGain, peaks]
      properties:
        id:
          type: integer
        instrument:
          type: string
          enum: [master, guitar, piano, bass, drums, vocal, other]
        label:
          type: string
        volume:
          type: number
          description: 0-100
        muted:
          type: boolean
        soloable:
          type: boolean
        pan:
          type: number
        streamUrl:
          type: string
        offset:
          type: number
        normalizationGain:
          type: number
        peaks:
          type: ["array", "null"]
          items:
            type: number

    AnalyzeResult:
      type: object
      required: [songId, status, beatCount, chordCount]
      properties:
        songId:
          type: integer
        status:
          type: string
          enum: [completed]
        beatCount:
          type: integer
        chordCount:
          type: integer

    Chord:
      type: object
      required: [id, name, instrument, difficulty, fingers, strings]
      properties:
        id:
          type: integer
        name:
          type: string
        instrument:
          type: string
        difficulty:
          type: string
        fingers:
          type: array
          items:
            type: integer
        strings:
          type: array
          items:
            type: integer
        description:
          type: ["string", "null"]
        audioUrl:
          type: ["string", "null"]

    User:
      type: object
      required: [id, username, email, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        preferredInstrument:
          type: ["string", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        bio:
          type: string
        preferredInstrument:
          type: string

    LibrarySong:
      type: object
      required: [id, title, artist, artistId, difficulty, duration, bpm, key, mode, timeSignature, coverUrl, playCount, featured, status, fileKey, fileUrl, mimeType, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: ["string", "null"]
        artistId:
          type: ["integer", "null"]
        difficulty:
          type: string
        duration:
          type: ["number", "null"]
        bpm:
          type: ["number", "null"]
        key:
          type: ["string", "null"]
        musicalKey:
          type: ["string", "null"]
        mode:
          type: ["string", "null"]
        timeSignature:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        playCount:
          type: integer
        featured:
          type: boolean
        status:
          type: string
        fileKey:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        mimeType:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StorageQuota:
      type: object
      required: [storageUsedBytes, storageQuotaBytes]
      properties:
        storageUsedBytes:
          type: integer
          description: Total bytes used by user's uploaded files
        storageQuotaBytes:
          type: integer
          description: Maximum bytes allowed for the user (configurable per-user)

    DeleteSongResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean

    AudioMimeType:
      type: string
      enum: [audio/mpeg, audio/wav, audio/flac, audio/mp4, audio/ogg]

    PresignUploadInput:
      type: object
      required: [fileName, fileSize, mimeType, duration]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        fileSize:
          type: integer
          minimum: 1
          maximum: 104857600
        mimeType:
          $ref: "#/components/schemas/AudioMimeType"
        duration:
          type: number
          exclusiveMinimum: 0
          maximum: 600

    PresignUploadResult:
      type: object
      required: [uploadUrl, uploadToken, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        uploadToken:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    ConfirmUploadInput:
      type: object
      required: [uploadToken, expectedSize, expectedMime, duration]
      properties:
        uploadToken:
          type: string
          format: uuid
        expectedSize:
          type: integer
          minimum: 1
          maximum: 104857600
        expectedMime:
          $ref: "#/components/schemas/AudioMimeType"
        title:
          type: string
          minLength: 1
          maxLength: 255
        duration:
          type: number
          exclusiveMinimum: 0
          maximum: 600

    ConfirmUploadResult:
      type: object
      required: [songId, status]
      properties:
        songId:
          type: integer
        status:
          type: string
          enum: [uploaded]

    CancelUploadResult:
      type: object
      required: [cancelled]
      properties:
        cancelled:
          type: boolean

    LearningSession:
      type: object
      required: [id, chordName, instrument, startedAt, attemptsCount, successCount]
      properties:
        id:
          type: integer
        chordName:
          type: string
        instrument:
          type: string
        startedAt:
          type: string
        attemptsCount:
          type: integer
        successCount:
          type: integer
        mastered:
          type: boolean

    LearningSessionInput:
      type: object
      required: [chordName, instrument]
      properties:
        chordName:
          type: string
        instrument:
          type: string

    ChordAttemptInput:
      type: object
      required: [success, confidenceScore]
      properties:
        success:
          type: boolean
        confidenceScore:
          type: number
          description: 0-1

    ChordAttempt:
      type: object
      required: [id, sessionId, success, confidenceScore, attemptedAt]
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        success:
          type: boolean
        confidenceScore:
          type: number
        attemptedAt:
          type: string

    MasteredChord:
      type: object
      required: [chordName, instrument, masteredAt, totalAttempts, successRate]
      properties:
        chordName:
          type: string
        instrument:
          type: string
        masteredAt:
          type: string
        totalAttempts:
          type: integer
        successRate:
          type: number
