name: Push Drizzle Schema to Neon

on:
  workflow_dispatch:

jobs:
  push-schema:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Install deps
        run: pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Install drizzle packages
        run: pnpm add -Dw drizzle-kit drizzle-orm

      - name: Push schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit push --config=packages/db/drizzle.config.ts --force
