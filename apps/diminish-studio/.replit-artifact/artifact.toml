kind = "web"
previewPath = "/"
title = "DiminishStudio"
version = "1.0.0"
id = "apps/diminish-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22322

[services.development]
run = "pnpm --filter @workspace/diminish-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diminish-studio", "run", "build" ]
publicDir = "apps/diminish-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22322"
BASE_PATH = "/"
